<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý Danh mục - Task Gamification">
  <title>Danh mục | Gamification</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🎮</span>
        <h2>Gamification</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="/categories.html" class="nav-item active">
          <span class="nav-icon">📁</span> Danh mục
        </a>
        <a href="/tasks.html" class="nav-item">
          <span class="nav-icon">✅</span> Công việc
        </a>
        <a href="/habits.html" class="nav-item">
          <span class="nav-icon">🔄</span> Thói quen
        </a>
        <a href="/rewards.html" class="nav-item">
          <span class="nav-icon">🎁</span> Phần thưởng
        </a>
        <a href="/leaderboard.html" class="nav-item">
          <span class="nav-icon">🏆</span> Xếp hạng
        </a>
        <a href="/notifications.html" class="nav-item">
          <span class="nav-icon">🔔</span> Thông báo
          <span class="nav-badge" id="notification-badge" style="display:none">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-details">
            <div class="name" id="user-name">Loading...</div>
            <div class="role" id="user-role">-</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <span>🚪</span> Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1>📁 Quản lý Danh mục</h1>
        <p>Phân loại Task và Habit (Chức năng: Mỹ Tâm)</p>
      </div>

      <!-- Form Thêm / Cập nhật Danh mục -->
      <div class="card slide-up" style="margin-bottom: 24px;">
        <h2 id="form-title" style="margin-bottom: 15px; font-size: 1.2rem;">Tạo Danh mục mới</h2>
        <form id="categoryForm">
          <input type="hidden" id="categoryId">
          <div class="form-group" style="margin-bottom: 15px;">
            <label for="name" style="display:block; margin-bottom:5px; font-weight:600;">Tên danh mục (*)</label>
            <input type="text" id="name" placeholder="VD: Học tập, Sức khỏe..." required style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);">
          </div>
          <div class="form-group" style="margin-bottom: 15px;">
            <label for="description" style="display:block; margin-bottom:5px; font-weight:600;">Mô tả</label>
            <textarea id="description" rows="3" placeholder="Mô tả ngắn gọn..." style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">Lưu Danh Mục</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none; margin-left: 10px;" onclick="resetForm()">Hủy</button>
        </form>
      </div>

      <!-- Bảng hiển thị danh sách -->
      <div class="card slide-up" style="animation-delay: 0.1s;">
        <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Danh sách hiện có</h2>
        <div style="overflow-x: auto;">
          <table class="leaderboard-table" style="width: 100%;">
            <thead>
              <tr>
                <th style="text-align:left; padding:12px;">ID</th>
                <th style="text-align:left; padding:12px;">Tên Danh mục</th>
                <th style="text-align:left; padding:12px;">Mô tả</th>
                <th style="text-align:right; padding:12px;">Hành động</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody">
              <tr><td colspan="4"><div class="loading-spinner"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }

    const user = getUser();
    initUserUI(user);
    initSocket();
    updateNotificationBadge();

    function initUserUI(user) {
      if (!user) return;
      document.getElementById('user-name').textContent = user.full_name;
      document.getElementById('user-role').textContent = user.role_id === 1 ? 'Admin' : 'User';
      document.getElementById('user-avatar').textContent = user.full_name.charAt(0).toUpperCase();
    }

    const API_URL = '/api/categories';
    document.addEventListener('DOMContentLoaded', fetchCategories);

    async function fetchCategories() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        const tbody = document.getElementById('categoryTableBody');
        tbody.innerHTML = '';
        
        if(result.success && result.data.length > 0) {
          result.data.forEach(cat => {
            tbody.innerHTML += `
              <tr>
                <td style="padding:12px;">${cat.id}</td>
                <td style="padding:12px;"><strong>${escapeHtml(cat.name)}</strong></td>
                <td style="padding:12px; color:var(--text-muted);">${escapeHtml(cat.description) || '<i>Không có mô tả</i>'}</td>
                <td style="padding:12px; text-align:right;">
                  <button class="btn btn-ghost btn-sm" onclick="editCategory(${cat.id}, '${escapeQuotes(cat.name)}', '${escapeQuotes(cat.description || '')}')">Sửa</button>
                  <button class="btn btn-accent btn-sm" style="background:#ef4444; border-color:#ef4444;" onclick="deleteCategory(${cat.id})">Xóa</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><h3>Chưa có danh mục</h3><p>Hãy tạo danh mục đầu tiên!</p></div></td></tr>';
        }
      } catch (error) {
        showToast('Lỗi', 'Không thể tải dữ liệu danh mục', 'error');
      }
    }

    document.getElementById('categoryForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const id = document.getElementById('categoryId').value;
      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Đang lưu...';

      try {
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description })
        });
        const result = await response.json();
        
        if (result.success) {
          showToast('Thành công', id ? 'Cập nhật thành công!' : 'Tạo mới thành công!', 'success');
          resetForm();
          fetchCategories();
        } else {
          showToast('Lỗi', result.message, 'error');
        }
      } catch (error) {
        showToast('Lỗi', 'Không kết nối được tới máy chủ', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Lưu Danh Mục';
      }
    });

    async function deleteCategory(id) {
      if (!confirm('Bạn có chắc chắn muốn xóa danh mục này?')) return;
      try {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          showToast('Đã xóa', 'Xóa danh mục thành công', 'success');
          fetchCategories();
        } else {
          showToast('Lỗi', result.message, 'error');
        }
      } catch (error) {
        showToast('Lỗi', 'Không kết nối được tới máy chủ', 'error');
      }
    }

    function editCategory(id, name, description) {
      document.getElementById('form-title').innerText = `Sửa Danh mục #${id}`;
      document.getElementById('categoryId').value = id;
      document.getElementById('name').value = name;
      document.getElementById('description').value = description;
      document.getElementById('cancelBtn').style.display = 'inline-block';
      document.getElementById('submitBtn').innerText = 'Cập Nhật';
    }

    function resetForm() {
      document.getElementById('form-title').innerText = 'Tạo Danh mục mới';
      document.getElementById('categoryId').value = '';
      document.getElementById('name').value = '';
      document.getElementById('description').value = '';
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('submitBtn').innerText = 'Lưu Danh Mục';
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
    }
    function escapeQuotes(str) {
      return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
    }
    function logout() {
      clearAuth();
      window.location.href = '/';
    }
  </script>
</body>
</html>
