<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quản lý Công việc - Task Gamification">
  <title>Công việc | Gamification</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🎮</span>
        <h2>Gamification</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="/categories.html" class="nav-item">
          <span class="nav-icon">📁</span> Danh mục
        </a>
        <a href="/tasks.html" class="nav-item active">
          <span class="nav-icon">✅</span> Công việc
        </a>
        <a href="/habits.html" class="nav-item">
          <span class="nav-icon">🔄</span> Thói quen
        </a>
        <a href="/rewards.html" class="nav-item">
          <span class="nav-icon">🎁</span> Phần thưởng
        </a>
        <a href="/leaderboard.html" class="nav-item">
          <span class="nav-icon">🏆</span> Xếp hạng
        </a>
        <a href="/notifications.html" class="nav-item">
          <span class="nav-icon">🔔</span> Thông báo
          <span class="nav-badge" id="notification-badge" style="display:none">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-details">
            <div class="name" id="user-name">Loading...</div>
            <div class="role" id="user-role">-</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <span>🚪</span> Đăng xuất
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1>✅ Quản lý Công việc</h1>
        <p>Làm task để nhận điểm thưởng (Chức năng: Mỹ Tâm)</p>
      </div>

      <!-- Form Thêm / Cập nhật Task -->
      <div class="card slide-up" style="margin-bottom: 24px;">
        <h2 id="form-title" style="margin-bottom: 15px; font-size: 1.2rem;">Tạo Công việc mới</h2>
        <form id="taskForm">
          <input type="hidden" id="taskId">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group">
              <label for="title" style="display:block; margin-bottom:5px; font-weight:600;">Tên công việc (*)</label>
              <input type="text" id="title" placeholder="VD: Làm bài tập toán..." required style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);">
            </div>
            <div class="form-group">
              <label for="category_id" style="display:block; margin-bottom:5px; font-weight:600;">Danh mục</label>
              <select id="category_id" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);">
                <option value="">-- Chọn danh mục --</option>
              </select>
            </div>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div class="form-group">
              <label for="point_reward" style="display:block; margin-bottom:5px; font-weight:600;">Điểm thưởng (⭐)</label>
              <input type="number" id="point_reward" value="10" min="1" required style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);">
            </div>
            <div class="form-group">
              <label for="priority" style="display:block; margin-bottom:5px; font-weight:600;">Mức độ ưu tiên</label>
              <select id="priority" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);">
                <option value="low">Thấp</option>
                <option value="medium" selected>Trung bình</option>
                <option value="high">Cao</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 15px;">
            <label for="description" style="display:block; margin-bottom:5px; font-weight:600;">Mô tả chi tiết</label>
            <textarea id="description" rows="2" placeholder="Ghi chú thêm về công việc này..." style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:6px; background:var(--bg-color); color:var(--text-color);"></textarea>
          </div>
          
          <button type="submit" class="btn btn-primary" id="submitBtn">Lưu Công Việc</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none; margin-left: 10px;" onclick="resetForm()">Hủy</button>
        </form>
      </div>

      <!-- Bảng hiển thị danh sách -->
      <div class="card slide-up" style="animation-delay: 0.1s;">
        <h2 style="margin-bottom: 15px; font-size: 1.2rem;">Danh sách công việc của bạn</h2>
        <div style="overflow-x: auto;">
          <table class="leaderboard-table" style="width: 100%;">
            <thead>
              <tr>
                <th style="text-align:left; padding:12px;">Tên công việc</th>
                <th style="text-align:center; padding:12px;">Mức độ</th>
                <th style="text-align:center; padding:12px;">Điểm</th>
                <th style="text-align:center; padding:12px;">Trạng thái</th>
                <th style="text-align:right; padding:12px;">Hành động</th>
              </tr>
            </thead>
            <tbody id="taskTableBody">
              <tr><td colspan="5"><div class="loading-spinner"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }

    const user = getUser();
    initUserUI(user);
    initSocket();
    updateNotificationBadge();

    function initUserUI(user) {
      if (!user) return;
      document.getElementById('user-name').textContent = user.full_name;
      document.getElementById('user-role').textContent = user.role_id === 1 ? 'Admin' : 'User';
      document.getElementById('user-avatar').textContent = user.full_name.charAt(0).toUpperCase();
    }

    const API_URL = '/api/tasks';
    
    // Chạy khi tải trang
    document.addEventListener('DOMContentLoaded', () => {
      fetchCategories();
      fetchTasks();
    });

    // Lấy danh sách Categories đổ vào thẻ Select
    async function fetchCategories() {
      try {
        const res = await fetch('/api/categories');
        const data = await res.json();
        const select = document.getElementById('category_id');
        if (data.success && data.data) {
          data.data.forEach(cat => {
            select.innerHTML += `<option value="${cat.id}">${escapeHtml(cat.name)}</option>`;
          });
        }
      } catch (err) { console.error('Lỗi tải danh mục'); }
    }

    // Lấy danh sách Tasks
    async function fetchTasks() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        const tbody = document.getElementById('taskTableBody');
        tbody.innerHTML = '';
        
        if(result.success && result.data.length > 0) {
          result.data.forEach(task => {
            const isCompleted = task.status === 'completed';
            const statusBadge = isCompleted 
                ? `<span style="background:#10b981; color:white; padding:4px 8px; border-radius:12px; font-size:0.8rem;">Đã xong</span>`
                : `<span style="background:#f59e0b; color:white; padding:4px 8px; border-radius:12px; font-size:0.8rem;">Chờ xử lý</span>`;
            
            const priorityBadge = task.priority === 'high' ? '🔴 Cao' : (task.priority === 'low' ? '🟢 Thấp' : '🟡 TB');

            tbody.innerHTML += `
              <tr style="${isCompleted ? 'opacity: 0.6; text-decoration: line-through;' : ''}">
                <td style="padding:12px;"><strong>${escapeHtml(task.title)}</strong></td>
                <td style="padding:12px; text-align:center;">${priorityBadge}</td>
                <td style="padding:12px; text-align:center; color:#fbbf24; font-weight:bold;">+${task.point_reward} ⭐</td>
                <td style="padding:12px; text-align:center;">${statusBadge}</td>
                <td style="padding:12px; text-align:right;">
                  ${!isCompleted ? `<button class="btn btn-accent btn-sm" onclick="completeTask(${task.id})">✨ Hoàn thành</button>` : ''}
                  <button class="btn btn-ghost btn-sm" style="color:#ef4444;" onclick="deleteTask(${task.id})">Xóa</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><h3>Chưa có công việc nào</h3><p>Hãy tạo một công việc mới ở trên!</p></div></td></tr>';
        }
      } catch (error) {
        showToast('Lỗi', 'Không thể tải dữ liệu Task', 'error');
      }
    }

    // Hoàn thành Task (Gọi Transaction)
    async function completeTask(id) {
      if (!confirm('Bạn đã thực sự hoàn thành công việc này?')) return;
      try {
        const response = await fetch(`${API_URL}/${id}/complete`, { method: 'POST' });
        const result = await response.json();
        if (result.success) {
          showToast('🎉 Chúc mừng!', result.message, 'success'); // Hiển thị thông báo được cộng điểm
          fetchTasks(); // Tải lại bảng
        } else {
          showToast('Lỗi', result.message, 'error');
        }
      } catch (error) {
        showToast('Lỗi', 'Không kết nối được tới máy chủ', 'error');
      }
    }

    // Tạo mới Task
    document.getElementById('taskForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        point_reward: document.getElementById('point_reward').value,
        priority: document.getElementById('priority').value,
        category_id: document.getElementById('category_id').value || null
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.success) {
          showToast('Thành công', 'Tạo công việc thành công!', 'success');
          document.getElementById('taskForm').reset();
          fetchTasks();
        } else {
          showToast('Lỗi', result.message, 'error');
        }
      } catch (error) {
        showToast('Lỗi', 'Không kết nối được tới máy chủ', 'error');
      }
    });

    // Xóa Task
    async function deleteTask(id) {
      if (!confirm('Bạn có chắc chắn muốn xóa công việc này?')) return;
      try {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          showToast('Đã xóa', 'Xóa công việc thành công', 'success');
          fetchTasks();
        } else {
          showToast('Lỗi', result.message, 'error');
        }
      } catch (error) {
        showToast('Lỗi', 'Không kết nối được tới máy chủ', 'error');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
    }
    function logout() { clearAuth(); window.location.href = '/'; }
  </script>
</body>
</html>
